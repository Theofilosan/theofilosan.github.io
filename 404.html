<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080a12">
    <meta name="robots" content="noindex">
    <title>404 | Theofylaktos Anastasiadis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080a12'/%3E%3Ctext x='7' y='45' font-family='monospace' font-size='36' font-weight='bold' fill='%238df3c0'%3E%3E_%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #080a12; color: #edf4eb; font: 400 16px/1.7 'IBM Plex Mono', monospace; text-align: center; }
        .wrap { padding: 40px 24px; }
        .code { margin: 0 0 8px; color: #ed91d6; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
        h1 { margin: 0 0 22px; font-family: 'Press Start 2P', monospace; font-size: clamp(1.6rem, 7vw, 3.2rem); line-height: 1.4; color: #8df3c0; }
        p { margin: 0 0 30px; color: #aab9be; }
        a.home { display: inline-block; padding: 10px 17px; border: 1px solid #8df3c0; background: #8df3c0; color: #080a12; font-weight: 700; font-size: 12px; text-decoration: none; box-shadow: 4px 4px 0 #214b45; }
        a.home:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 #214b45; }
        a.home:active { transform: scale(.97); box-shadow: 1px 1px 0 #214b45; }
    </style>
</head>
<body>
    <main class="wrap">
        <p class="code">ERROR 404 // LEVEL NOT FOUND</p>
        <h1>GAME OVER</h1>
        <p>This level doesn't exist. It may have been moved, renamed, or never unlocked.</p>
        <a class="home" href="/">&gt; Back to start</a>
    </main>
</body>
</html>
